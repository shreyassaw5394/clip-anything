[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clip-anything"
version = "0.3.0"
description = "Free, local CLI: long gameplay recording in, top N vertical highlight clips out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_LICENSES.md"]
authors = [{ name = "Ship at Midnight" }]
keywords = ["video", "highlights", "clips", "gameplay", "ffmpeg", "shorts", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Video :: Conversion",
]
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.13,<2",
  "opencv-python-headless>=4.10,<5",
  "rich>=13,<16",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
captions = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]
desktop = ["pyinstaller>=6.10,<7"]
app = [
    "pywebview>=5,<7",
]

[project.urls]
Homepage = "https://shipatmidnight.dev/clip-anything"
Source = "https://github.com/shreyassaw5394/clip-anything"
Changelog = "https://github.com/shreyassaw5394/clip-anything/blob/main/CHANGELOG.md"
Issues = "https://github.com/shreyassaw5394/clip-anything/issues"

[project.scripts]
clip-anything = "clip_anything.cli:app"
clip-anything-gui = "clip_anything.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["clip_anything"]

[tool.hatch.build.targets.sdist]
include = ["/clip_anything", "/README.md", "/LICENSE", "/NOTICE", "/THIRD_PARTY_LICENSES.md", "/CHANGELOG.md", "/clip-anything.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".planning", "tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

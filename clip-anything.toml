# clip-anything config. Load with `clip-anything video.mp4 --config clip-anything.toml`
# or drop it in the working directory. Every key is optional; these are the defaults.

[clips]
count = 10
min_s = 15.0
max_s = 45.0

[scoring]
w_loud = 1.0      # loudness above the rolling 60 s baseline
w_onset = 0.8     # spectral-flux onset sharpness (gunshots, explosions)
w_rms = 0.3       # absolute loudness
w_motion = 0.8    # visual motion on the proxy (phase 2)
w_cut = 0.15      # scene cut within +-1 s of the peak (phase 2)
w_speech = 0.3    # excitement words (phase 3)
w_mean = 0.2      # weighted mean of the signals
w_max = 0.4       # strongest single signal
w_agree = 0.4     # audio AND motion rising together (a lone signal cannot win alone)
w_card = 0.8      # penalty for static cards (lobby, menu, loading: still frame + text)
min_score = 0.2  # --count is a maximum: nothing below max(this, 0.35 x best score) is returned
min_evidence = 0.5  # absolute action bar (--min-score): audio AND motion against fixed real-footage
                    # levels, so a menu never fills the list because the rest is quieter; 0 = off
prominence = 0.1
min_gap_s = 30.0
lead_frac = 0.6   # share of the clip before the peak (build-up)
w_voice = 0.0     # bonus: a voice reaction on the mic/mix (score *= 1 + w * signal); 0 = off
w_fade = 0.0      # bonus: a fade to black soon after the moment (something ended)
w_stinger = 0.0   # bonus: tonal music hit (cutscene music fires it too)
streak_gap_s = 25.0  # bursts this close to a peak merge into one clip...
streak_max_s = 60.0  # ...which may stretch to this long (beyond max_s) when it needs to
# preset = "shooter"  # or: racing | sports | horror | story | funny (same as --preset)

[render]
crf = 20
preset = "veryfast"
fade_s = 0.3

[layout]
facecam = "auto"
crop = "follow"   # follow the action horizontally, or "center"
pan_speed = 0.25  # max pan speed, fraction of source width per second
deadband = 0.06   # ignore target moves smaller than this fraction of crop travel

# Enabled 2026-11-14. One-time setup on PyPI (owner only) before the first tag that should publish:
#   1. On PyPI (and TestPyPI if wanted) open the project "clip-anything" > Publishing >
#      "Add a new publisher" (or a "pending publisher" before the first upload):
#        owner: shreyassaw5394   repository: clip-anything
#        workflow: publish.yml   environment: pypi
#   2. In GitHub repo Settings > Environments create "pypi"; add yourself as a required
#      reviewer so a tag push still needs one click.
#   3. Delete any PYPI_TOKEN / TESTPYPI_TOKEN secrets: trusted publishing needs none.
#   4. Push a version tag (`git tag vX.Y.Z && git push origin vX.Y.Z`); the `pypi` environment needs one approval click.
#
# Releases are built once from the tag and uploaded with OIDC (no long-lived token).

name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
      - name: Check the tag matches the package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          v=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          [ "v$v" = "$TAG" ] || { echo "tag $TAG != version $v"; exit 1; }
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC for PyPI trusted publishing
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          print-hash: true
